<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Falola Family Caregiver Pre-Hire Assessment</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#10233f;background:#f4f6f3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef4ef,#f8f4ea);min-height:100vh}.wrap{max-width:1040px;margin:0 auto;padding:32px 18px}.card{background:#fff;border-radius:22px;padding:28px;box-shadow:0 10px 40px #10233f18}.hero{margin-top:4vh}.badge{display:inline-block;background:#0c6b4d;color:#fff;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.4px}h1{font-size:clamp(30px,5vw,52px);line-height:1.02;margin:14px 0}h2{margin:8px 0}.form{display:grid;gap:12px;margin-top:24px}input,select{width:100%;padding:14px;border:1px solid #ccd5cf;border-radius:10px;font-size:16px}button{background:#0c6b4d;color:#fff;border:0;border-radius:11px;padding:14px 18px;font-weight:800;font-size:16px;cursor:pointer}button:disabled{opacity:.6}.small{font-size:13px;color:#5d6a67}.consent{display:flex;gap:10px;align-items:flex-start}.consent input{width:auto;margin-top:3px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.notice{background:#f0f6f2;border-left:4px solid #0c6b4d;padding:14px;margin:18px 0;border-radius:8px}.question{padding:22px 0;border-top:1px solid #e5e8e6}.qhead{display:flex;justify-content:space-between;color:#66736f;font-size:12px;text-transform:uppercase;font-weight:bold}.qhead em{font-style:normal;color:#0c6b4d}.option{display:flex;gap:10px;padding:12px;border:1px solid #dde3df;border-radius:10px;margin:8px 0;cursor:pointer}.option input{width:auto}.selected{border-color:#0c6b4d;background:#f1f8f4}.submit{width:100%;margin-top:20px}.score{font-size:72px;font-weight:900;color:#0c6b4d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:20px 0}.mini{border:1px solid #e0e4e2;border-radius:12px;padding:14px}.mini span{display:block;font-size:24px;margin-top:8px;color:#0c6b4d}.error{background:#fff1f1;color:#8b1a1a;padding:10px 12px;border-radius:8px}@media(max-width:650px){.card{padding:18px}.top,.qhead{align-items:flex-start;flex-direction:column}.wrap{padding:14px}}
</style></head><body><main class="wrap"><div id="app"></div></main><script>
const API='https://nhjuafnlnhbhfshsqxpx.supabase.co/functions/v1/caregiver-assessment';
const KEY='sb_publishable_sBi61Ejo5-NHNH4M3u_ofA_ydYG2khC';
const labels={aptitude:'Aptitude & Reasoning',care:'Elder-Care & Dialysis Safety',communication:'Communication',judgment:'Situational Judgment & Reliability',leadership:'Household Coordination & Managerial Skills',integrity:'Confidentiality, Boundaries & Integrity',digital:'Documentation & Digital Literacy'};
let candidate=null,questions=[],answers={};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function call(action,body={},adminKey=''){const h={'content-type':'application/json','apikey':KEY,'authorization':'Bearer '+KEY};if(adminKey)h['x-admin-key']=adminKey;const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify({action,...body})});const j=await r.json().catch(()=>({error:'Unexpected server response'}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function home(){document.getElementById('app').innerHTML=`<section class="card hero"><div class="badge">THE FALOLA FAMILY · AJAH, LAGOS</div><h1>Caregiver / Home Aide Pre-Hire Assessment</h1><p>Individualized, candidate-identifiable assessment covering elder-care safety, dialysis support, aptitude, communication, reliability, household coordination, confidentiality and documentation.</p><div class="notice"><b>Format:</b> 48 individualized questions. Question selection and scoring are performed securely on the server; correct answers are not sent to the browser.</div><form id="startForm" class="form"><input required name="name" placeholder="Full legal name"><input required type="email" name="email" placeholder="Email"><input required name="phone" placeholder="Phone / WhatsApp"><select name="role"><option>Live-In Caregiver / Home Aide</option><option>Daytime / Relief Caregiver</option><option>Driver / Care Support</option></select><input name="code" placeholder="Invitation code (if provided)"><label class="consent"><input required type="checkbox"> I confirm the information is mine and I will complete this assessment independently.</label><div id="err"></div><button id="begin">Begin assessment</button></form><p class="small">Recommended time: 55–70 minutes. This assessment supplements interviews, identity verification, references and practical skill checks.</p></section>`;document.getElementById('startForm').onsubmit=start}
async function start(e){e.preventDefault();const b=document.getElementById('begin');b.disabled=true;b.textContent='Starting…';document.getElementById('err').innerHTML='';const body=Object.fromEntries(new FormData(e.currentTarget).entries());try{const j=await call('start',body);candidate={attemptId:j.attemptId,candidateId:j.candidateId,name:body.name,role:body.role};questions=j.questions;answers={};test()}catch(x){document.getElementById('err').innerHTML=`<p class="error">${esc(x.message)}</p>`;b.disabled=false;b.textContent='Begin assessment'}}
function test(){document.getElementById('app').innerHTML=`<section class="card"><div class="top"><div><div class="badge">${esc(candidate.candidateId)}</div><h2>${esc(candidate.name)}</h2></div><div id="progress">0/${questions.length} answered</div></div><div class="notice">Choose the best answer. Your responses are saved when you submit the completed assessment.</div><div id="qs"></div><div id="err"></div><button id="submit" class="submit">Submit assessment</button></section>`;const box=document.getElementById('qs');questions.forEach((q,i)=>{const d=document.createElement('div');d.className='question';d.innerHTML=`<div class="qhead"><span>Question ${i+1}</span><em>${esc(labels[q.domain]||q.domain)}</em></div><h3>${esc(q.prompt)}</h3>`+q.options.map((o,j)=>`<label class="option" id="o-${q.id}-${j}"><input type="radio" name="${q.id}" value="${j}"> <span>${esc(o)}</span></label>`).join('');box.appendChild(d);d.querySelectorAll('input').forEach(el=>el.onchange=()=>answer(q.id,Number(el.value)))});document.getElementById('submit').onclick=submit}
function answer(id,j){answers[id]=j;document.querySelectorAll(`[id^="o-${id}-"]`).forEach(x=>x.classList.remove('selected'));document.getElementById(`o-${id}-${j}`).classList.add('selected');document.getElementById('progress').textContent=`${Object.keys(answers).length}/${questions.length} answered`}
async function submit(){if(Object.keys(answers).length!==questions.length){document.getElementById('err').innerHTML='<p class="error">Please answer every question before submitting.</p>';return}const b=document.getElementById('submit');b.disabled=true;b.textContent='Submitting…';try{const r=await call('submit',{attemptId:candidate.attemptId,answers});result(r)}catch(x){document.getElementById('err').innerHTML=`<p class="error">${esc(x.message)}</p>`;b.disabled=false;b.textContent='Submit assessment'}}
function result(r){document.getElementById('app').innerHTML=`<section class="card hero"><div class="badge">${esc(r.candidateId)}</div><h1>Assessment completed</h1><p><b>${esc(r.candidateName)}</b> · ${esc(r.role)}</p><div class="score">${r.overall}%</div><p>This is a job-related assessment score and should not be the sole basis for an employment decision.</p><div class="grid">${Object.entries(r.domainScores).map(([d,s])=>`<div class="mini"><b>${esc(labels[d]||d)}</b><span>${s}%</span></div>`).join('')}</div><p class="small">Your result has been securely recorded for recruitment review.</p></section>`}
home();
</script></body></html>
