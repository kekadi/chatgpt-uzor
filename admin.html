<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Falola Assessment Admin</title><style>body{font-family:Arial,sans-serif;background:#f4f6f3;color:#10233f;margin:0}.wrap{max-width:1200px;margin:auto;padding:30px}.card{background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 30px #10233f18}.bar{display:flex;gap:10px}.bar input{flex:1;padding:12px;border:1px solid #ccd5cf;border-radius:8px}.bar button{padding:12px 18px;border:0;border-radius:8px;background:#0c6b4d;color:#fff;font-weight:bold}.err{color:#8b1a1a}.table{overflow:auto;margin-top:20px}table{border-collapse:collapse;width:100%}th,td{padding:10px;border-bottom:1px solid #e5e8e6;text-align:left;vertical-align:top}small{color:#66736f}</style></head><body><main class="wrap"><section class="card"><h1>Assessment Results</h1><p>Recruitment administrator access.</p><div id="login"><div class="bar"><input id="email" type="email" placeholder="Administrator email"><input id="password" type="password" placeholder="Password"><button onclick="signin()">Sign in</button></div></div><div id="dash" style="display:none"><div class="bar"><button onclick="load()">Refresh results</button><button onclick="signout()">Sign out</button></div><p id="who"></p><div class="table"><table><thead><tr><th>Candidate</th><th>Role</th><th>Status</th><th>Overall</th><th>Completed</th><th>Contact</th></tr></thead><tbody id="rows"></tbody></table></div></div><p id="err" class="err"></p></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const URL='https://nhjuafnlnhbhfshsqxpx.supabase.co',KEY='sb_publishable_sBi61Ejo5-NHNH4M3u_ofA_ydYG2khC',API=URL+'/functions/v1/caregiver-assessment',sb=createClient(URL,KEY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.signin=async()=>{const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)return document.getElementById('err').textContent=error.message;document.getElementById('password').value='';await show()};
window.signout=async()=>{await sb.auth.signOut();await show()};
window.load=async()=>{document.getElementById('err').textContent='';const {data:{session}}=await sb.auth.getSession();if(!session)return show();const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','apikey':KEY,'authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'results'})});const j=await r.json();if(!r.ok)return document.getElementById('err').textContent=j.error||'Unable to load';document.getElementById('rows').innerHTML=j.results.map(x=>`<tr><td><b>${esc(x.candidate_name)}</b><br><small>${esc(x.candidate_id)}</small></td><td>${esc(x.role)}</td><td>${esc(x.status)}</td><td>${x.overall_score??'—'}</td><td>${x.completed_at?new Date(x.completed_at).toLocaleString():'—'}</td><td>${esc(x.candidate_email)}<br>${esc(x.candidate_phone)}</td></tr>`).join('')};
async function show(){const {data:{session}}=await sb.auth.getSession();document.getElementById('login').style.display=session?'none':'block';document.getElementById('dash').style.display=session?'block':'none';document.getElementById('who').textContent=session?'Signed in as '+session.user.email:'';if(session)await window.load()}
show();
</script></body></html>
