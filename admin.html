<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Falola Family Caregiver Recruitment Dashboard</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#10233f;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1320px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.brand h1{margin:0;font-size:28px}.brand p{margin:5px 0;color:#60706a}.card{background:#fff;border:1px solid #dfe7e2;border-radius:16px;box-shadow:0 8px 28px #173b2c12;padding:20px}.login{max-width:720px;margin:60px auto}.row{display:flex;gap:10px;flex-wrap:wrap}input,select{padding:11px 12px;border:1px solid #cbd7d1;border-radius:9px;background:#fff;font:inherit}input{min-width:220px;flex:1}button{border:0;border-radius:9px;padding:11px 15px;background:#087553;color:white;font-weight:700;cursor:pointer}.ghost{background:#e9f1ed;color:#173b2c}.danger{background:#8a2c2c}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input{min-width:260px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid #dfe7e2;border-radius:12px;padding:15px}.stat b{font-size:24px;display:block}.table{overflow:auto;background:#fff;border:1px solid #dfe7e2;border-radius:14px}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #e7ece9;text-align:left;vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#60706a}.pill{padding:4px 8px;border-radius:999px;background:#edf2ef;font-size:12px}.completed{background:#dcf5e9}.started{background:#fff2cc}.expired,.reset{background:#eee}.score{font-size:20px;font-weight:800}.small{font-size:12px;color:#697871}.hidden{display:none}.msg{color:#8a2c2c;margin-top:12px}.detail{position:fixed;inset:0;background:#071a1399;display:flex;justify-content:flex-end;z-index:10}.panel{width:min(650px,95vw);height:100%;background:#fff;padding:24px;overflow:auto}.domains{display:grid;grid-template-columns:1fr 1fr;gap:10px}.domain{border:1px solid #e0e7e3;border-radius:10px;padding:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}}
@media print{.top button,.toolbar,.actions,.close{display:none!important}.detail{position:static;background:none}.panel{width:100%;height:auto}.wrap>section:not(.detail){display:none}}
</style></head><body><main class="wrap"><div class="top"><div class="brand"><h1>Falola Family Caregiver Recruitment</h1><p>Pre-Hire Assessment Administration</p></div><div id="sessionBox" class="hidden"><span id="who" class="small"></span> <button class="ghost" id="signout">Sign out</button></div></div>
<section id="login" class="card login"><h2>Administrator sign in</h2><p>Authorized recruitment administrators only.</p><div class="row"><input id="email" type="email" autocomplete="username" placeholder="Administrator email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signin">Sign in</button></div><p id="loginMsg" class="msg"></p></section>
<section id="dashboard" class="hidden"><div class="stats"><div class="stat"><span class="small">Total</span><b id="sTotal">0</b></div><div class="stat"><span class="small">Completed</span><b id="sDone">0</b></div><div class="stat"><span class="small">In progress</span><b id="sStarted">0</b></div><div class="stat"><span class="small">Average score</span><b id="sAvg">—</b></div></div>
<div class="toolbar"><input id="search" placeholder="Search name, email, phone or ID"><select id="status"><option value="">All statuses</option><option>completed</option><option>started</option><option>expired</option><option>reset</option></select><select id="role"><option value="">All roles</option></select><button id="refresh">Refresh</button><button class="ghost" id="csv">Export CSV</button></div>
<div class="table"><table><thead><tr><th>Candidate</th><th>Role</th><th>Status</th><th>Overall</th><th>Started</th><th>Completed</th><th>Contact</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p id="msg" class="msg"></p></section>
<section id="detail" class="detail hidden"><div class="panel"><button class="ghost close" id="close">Close</button><div id="detailBody"></div></div></section></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const URL='https://nhjuafnlnhbhfshsqxpx.supabase.co',KEY='sb_publishable_sBi61Ejo5-NHNH4M3u_ofA_ydYG2khC',API=URL+'/functions/v1/caregiver-assessment',sb=createClient(URL,KEY);let all=[],current=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dt=x=>x?new Date(x).toLocaleString():'—';
async function session(){return(await sb.auth.getSession()).data.session}async function api(action,extra={}){const s=await session();if(!s)throw Error('Sign in required');const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','apikey':KEY,'authorization':'Bearer '+s.access_token},body:JSON.stringify({action,...extra})}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function show(){const s=await session();$('login').classList.toggle('hidden',!!s);$('dashboard').classList.toggle('hidden',!s);$('sessionBox').classList.toggle('hidden',!s);if(s){$('who').textContent=s.user.email;await load()}}
async function load(){try{const j=await api('results');all=j.results||[];const roles=[...new Set(all.map(x=>x.role))].sort();$('role').innerHTML='<option value="">All roles</option>'+roles.map(x=>'<option>'+esc(x)+'</option>').join('');render()}catch(e){$('msg').textContent=e.message}}
function filtered(){const q=$('search').value.toLowerCase(),st=$('status').value,ro=$('role').value;return all.filter(x=>(!st||x.status===st)&&(!ro||x.role===ro)&&(!q||[x.candidate_name,x.candidate_email,x.candidate_phone,x.candidate_id].some(v=>String(v||'').toLowerCase().includes(q))))}
function render(){const f=filtered(),done=all.filter(x=>x.status==='completed'&&Number.isFinite(Number(x.overall_score)));$('sTotal').textContent=all.length;$('sDone').textContent=all.filter(x=>x.status==='completed').length;$('sStarted').textContent=all.filter(x=>x.status==='started').length;$('sAvg').textContent=done.length?Math.round(done.reduce((a,x)=>a+Number(x.overall_score),0)/done.length)+'%':'—';$('rows').innerHTML=f.map(x=>`<tr><td><b>${esc(x.candidate_name)}</b><br><span class="small">${esc(x.candidate_id)}</span></td><td>${esc(x.role)}</td><td><span class="pill ${esc(x.status)}">${esc(x.status)}</span></td><td class="score">${x.overall_score==null?'—':x.overall_score+'%'}</td><td>${dt(x.started_at)}</td><td>${dt(x.completed_at)}</td><td>${esc(x.candidate_email)}<br>${esc(x.candidate_phone)}</td><td><button class="ghost view" data-id="${x.id}">View</button></td></tr>`).join('');document.querySelectorAll('.view').forEach(b=>b.onclick=()=>openDetail(b.dataset.id))}
function openDetail(id){current=all.find(x=>x.id===id);if(!current)return;const domains=current.domain_scores||{};$('detailBody').innerHTML=`<h2>${esc(current.candidate_name)}</h2><p><b>${esc(current.candidate_id)}</b> · ${esc(current.role)}</p><p>${esc(current.candidate_email)} · ${esc(current.candidate_phone)}</p><p>Status: <span class="pill ${esc(current.status)}">${esc(current.status)}</span> &nbsp; Overall: <span class="score">${current.overall_score==null?'—':current.overall_score+'%'}</span></p><h3>Domain scores</h3><div class="domains">${Object.entries(domains).map(([k,v])=>`<div class="domain"><b>${esc(k.replaceAll('_',' '))}</b><br><span class="score">${v}%</span></div>`).join('')||'<p>No domain scores until completion.</p>'}</div><h3>Timeline</h3><p>Started: ${dt(current.started_at)}<br>Completed: ${dt(current.completed_at)}<br>Expired: ${dt(current.expired_at)}</p><div class="actions"><button onclick="window.print()">Print / Save PDF</button>${current.status==='started'?'<button class="danger" id="expire">Expire active attempt</button>':''}${current.status==='completed'?'<button class="danger" id="retake">Allow retake</button>':''}</div>`;$('detail').classList.remove('hidden');if($('expire'))$('expire').onclick=()=>adminAction('expire_attempt');if($('retake'))$('retake').onclick=()=>adminAction('allow_retake')}
async function adminAction(action){if(!current)return;const reason=prompt(action==='allow_retake'?'Reason for allowing retake:':'Reason for expiring attempt:');if(reason===null)return;try{await api(action,{attemptId:current.id,reason});$('detail').classList.add('hidden');await load()}catch(e){alert(e.message)}}
function csv(){const f=filtered(),cols=['candidate_id','candidate_name','candidate_email','candidate_phone','role','status','overall_score','started_at','completed_at'];const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';const out=[cols.join(','),...f.map(x=>cols.map(c=>quote(x[c])).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv'}));a.download='caregiver-assessment-results-'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href)}
$('signin').onclick=async()=>{try{$('loginMsg').textContent='';const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';await show()}catch(e){$('loginMsg').textContent=e.message}};$('signout').onclick=async()=>{await sb.auth.signOut();all=[];await show()};$('refresh').onclick=load;$('search').oninput=render;$('status').onchange=render;$('role').onchange=render;$('csv').onclick=csv;$('close').onclick=()=>$('detail').classList.add('hidden');show();
</script></body></html>
