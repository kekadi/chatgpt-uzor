t":"10:40 AM"}],"points":3},{"id":13,"item_id":"ROLE-009-SA01-Q13","section":"B","prompt":"A mock patient weighs 154 lb. Using the formula above, what is the approximate weight in kilograms?","options":[{"id":"A","text":"60 kg"},{"id":"B","text":"65 kg"},{"id":"C","text":"70 kg"},{"id":"D","text":"75 kg"}],"points":3},{"id":14,"item_id":"ROLE-009-SA01-Q14","section":"B","prompt":"From 8:00 AM through 12:00 PM, how many 20-minute appointment slots are available if no breaks or overbooking are used?","options":[{"id":"A","text":"10"},{"id":"B","text":"11"},{"id":"C","text":"12"},{"id":"D","text":"14"}],"points":3},{"id":15,"item_id":"ROLE-009-SA01-Q15","section":"B","prompt":"A fictional patient has an $85 balance and pays $60. What balance remains?","options":[{"id":"A","text":"$15"},{"id":"B","text":"$20"},{"id":"C","text":"$25"},{"id":"D","text":"$35 Delta Medical PA - MA Apprenticeship Selection Assessment"}],"points":3},{"id":16,"item_id":"ROLE-009-SA01-Q16","section":"C","prompt":"An older adult says, “I cannot hear you very well.” What is the best first response?","options":[{"id":"A","text":"Speak only to the family member."},{"id":"B","text":"Face the patient, reduce background noise, speak clearly at a normal pace, and confirm understanding."},{"id":"C","text":"Raise your voice as loudly as possible."},{"id":"D","text":"Hand the patient a form and end the conversation."}],"points":3},{"id":17,"item_id":"ROLE-009-SA01-Q17","section":"C","prompt":"A patient’s adult daughter asks for laboratory results. You do not know whether she is authorized to receive them. What should you do?","options":[{"id":"A","text":"Give the results because she is family."},{"id":"B","text":"Give only the “normal” results."},{"id":"C","text":"Verify authorization and follow privacy policy before disclosing any information."},{"id":"D","text":"Ask another patient in the waiting room what they would do."}],"points":3},{"id":18,"item_id":"ROLE-009-SA01-Q18","section":"C","prompt":"An older patient is frustrated because the physician is running behind. Which response is best?","options":[{"id":"A","text":"Tell the patient the delay is the physician’s fault."},{"id":"B","text":"Acknowledge the concern, give an accurate update if available, and offer appropriate options without blaming anyone."},{"id":"C","text":"Ignore the concern until the patient calms down."},{"id":"D","text":"Promise a specific time even if you do not know it."}],"points":3},{"id":19,"item_id":"ROLE-009-SA01-Q19","section":"C","prompt":"A patient using a walker appears to be having difficulty reaching the exam area. What is the best approach?","options":[{"id":"A","text":"Grab the walker and pull it forward."},{"id":"B","text":"Ask the patient how you can assist, preserve independence, and obtain trained help if needed."},{"id":"C","text":"Tell the patient to wait for a family member."},{"id":"D","text":"Assume the patient cannot walk safely and cancel the visit."}],"points":3},{"id":20,"item_id":"ROLE-009-SA01-Q20","section":"C","prompt":"A patient appears confused about follow-up instructions. What is the best response?","options":[{"id":"A","text":"Repeat the same words faster."},{"id":"B","text":"Use plain language, ask the patient to repeat the plan back in their own words, and involve an authorized caregiver when appropriate."},{"id":"C","text":"Tell the patient to search online later."},{"id":"D","text":"Document “patient confused” and take no further action. Delta Medical PA - MA Apprenticeship Selection Assessment"}],"points":3},{"id":21,"item_id":"ROLE-009-SA01-Q21","section":"D","prompt":"A caller reports new severe chest pressure and shortness of breath. What is the best action?","options":[{"id":"A","text":"Schedule the caller for next week."},{"id":"B","text":"Ask enough questions to decide whether the caller is having a heart attack."},{"id":"C","text":"Immediately follow Delta’s emergency escalation protocol and alert licensed clinical staff; do not independently d mention it later if symptoms develop."},{"id":"B","text":"Immediately follow the exposure-control procedure, including first aid and prompt reporting."},{"id":"C","text":"Hide the incident because it occurred during training."},{"id":"D","text":"Discard the device and take no other action. Delta Medical PA - MA Apprenticeship Selection Assessment"}],"points":5},{"id":26,"item_id":"ROLE-009-SA01-Q26","section":"E","prompt":"A patient wants to move a routine follow-up from Tuesday to Thursday.","options":[{"id":"A","text":"Billing"},{"id":"B","text":"Scheduling"},{"id":"C","text":"Referrals"},{"id":"D","text":"Forms/Admin"}],"points":3},{"id":27,"item_id":"ROLE-009-SA01-Q27","section":"E","prompt":"A patient says the pharmacy has no refills remaining for a long-term medication and requests renewal.","options":[{"id":"A","text":"Clinical/Refill queue"},{"id":"B","text":"Billing"},{"id":"C","text":"Scheduling"},{"id":"D","text":"Referrals"}],"points":3},{"id":28,"item_id":"ROLE-009-SA01-Q28","section":"E","prompt":"A patient asks whether the results of a recent CT scan were normal.","options":[{"id":"A","text":"Scheduling"},{"id":"B","text":"Forms/Admin"},{"id":"C","text":"Clinical/Provider queue"},{"id":"D","text":"Billing"}],"points":3},{"id":29,"item_id":"ROLE-009-SA01-Q29","section":"E","prompt":"A patient asks why the statement shows a $42 balance.","options":[{"id":"A","text":"Billing"},{"id":"B","text":"Clinical/Refill queue"},{"id":"C","text":"Referrals"},{"id":"D","text":"Scheduling"}],"points":3},{"id":30,"item_id":"ROLE-009-SA01-Q30","section":"E","prompt":"A patient says a specialist has not received an authorization and wants a status update.","options":[{"id":"A","text":"Billing"},{"id":"B","text":"Referrals"},{"id":"C","text":"Forms/Admin"},{"id":"D","text":"Clinical/Provider queue Delta Medical PA - MA Apprenticeship Selection Assessment"}],"points":3},{"id":31,"item_id":"ROLE-009-SA01-Q31","section":"F","prompt":"Read the fictional call and write a concise message for the clinical team. Do not give medical advice. Samuel Brown, DOB 12/15/1942, phone 469-555-0142, calls at 2:10 PM. He requests a refill of lisinopril 10 mg and says he has two tablets left. Preferred pharmacy: Walgreens on Main Street. He reports no urgent symptoms. He also asks whether he should take an extra tablet because his blood pressure was “high” this morning.","points":10,"options":[]}];const RUBRIC=[];const INITIAL=[];const names={A:'Clerical accuracy',B:'Math & scheduling',C:'Geriatric communication',D:'Safety, scope & privacy',E:'Learning aptitude',F:'Written communication'};let rows=structuredClone(INITIAL),audit=[],selected=null,mode="dashboard",question=1,started=false,submitted=false,remaining=4200,draft={};let lastFocus=null;

function dashboard(){const scored=rows.filter(r=>r.score.total!==null),pending=rows.length-scored.length,flags=rows.filter(r=>r.score.critical.length).length,mean=scored.length?(scored.reduce((a,r)=>a+r.score.total,0)/scored.length).toFixed(1):'—';$('app').innerHTML=`<div class="top"><div><div class="eyebrow">Recruitment workspace</div><h1>Apprentice selection</h1><span class="muted">October 2026 cohort · Medical Assistant Apprentice</span></div><button onclick="downloadCSV()">Export CSV</button></div>${banner()}<div class="stats">${[['Candidates',rows.length,'One source form'],['Scored mean',mean,'Completed written reviews only'],['Written reviews',pending,'Section F ratings pending'],['Safety flags',flags,'Q21–23 · human review']].map(x=>`<div class="card"><div class="muted small">${x[0]}</div><div class="metric">${x[1]}</div><span class="muted small">${x[2]}</span></div>`).join('')}</div><section class="card"><div class="row"><h2>Candidate pipeline</h2><span class="pill gray">Scored assessment</span></div><div class="tools"><input id="search" type="search" placeholder="Search candidate name or ID" aria-label="Search candidates" oninput="table()"><select id="filter" aria-label="Filter review state" onchange="table()"><option value="all">All review states</option><option value="pending">Written review pending</option><option value="flagged">Safety flagged</option><option value="final">Composite available</option></select><select id="sort" aria-label="Sort candidates" onchange="table()"><option value="name">Name A–Z</option><option value="score">Written score, highest first</option><option value="composite">Composite, highest first</option></select></div><div class="tablewrap" id="table"></div></section><div class="two"><section class="card"><h2>Assessment blueprint</h2><p class="muted small">70 minutes · 30 objective items + one written exercise · 100 points</p>${Object.entries(names).map(([k,n])=>{let max={A:20,B:15,C:15,D:25,E:15,F:10}[k];return `<div class="domain"><div class="row"><span>${k} · ${n}</span><strong>${max} pts</strong></div><div class="bar"><span style="width:${max*4}%"></span></div></div>`}).join('')}</section><section class="card"><h2>Review controls</h2><p><strong>Section F stays pending until a human grades it.</strong> Objective scores are shown out of 90; final scores are out of 100.</p><p class="muted">Internal recommendations: total ≥75, Section D ≥20/25, Q21–23 correct. Review flags require a documented disposition.</p><p class="muted">Composite: 40% written + 30% interview + 30% work sample. F-09 and F-10 full instruments must be supplied before operational ranking.</p><button onclick="switchMode('guide')">View administration guide</button></section></div><section class="card" style="margin-top:22px"><h2>Review activity</h2><div id="audit">${audit.length?audit.slice(0,8).map(x=>`<div class="audit"><strong>${esc(x.action)}</strong> · ${esc(x.id)}<br><span class="muted small">${esc(x.actor)} · ${esc(x.time)}</span></div>`).join(''):'<p class="muted">No changes in this session. Open a candidate to review the written exercise.</p>'}</div></section>`;table()}
function table(){let text=$('search').value.toLowerCase(),filter=$('filter').value,sort=$('sort').value;let data=rows.filter(r=>(r.name+' '+r.id).toLowerCase().includes(text)).filter(r=>filter==='all'||filter==='pending'&&r.score.total===null||filter==='flagged'&&r.score.critical.length||filter==='final'&&cmp(r)!==null);data.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='score'?(b.score.total??-1)-(a.score.total??-1):(cmp(b)??-1)-(cmp(a)??-1));$('table').innerHTML=data.length?`<table><thead><tr><th>Candidate</th><th>Written assessment</th><th>Safety</th><th>Review state</th><th>Composite</th><th></th></tr></thead><tbody>${data.map(r=>`<tr><td class="name"><strong>${esc(r.name)}</strong><small>${r.id} · Attempt ${r.attempt}</small></td><td><strong>${r.score.total===null?r.score.objective+' / 90':r.score.total+' / 100'}</strong><br><small class="muted">${r.score.total===null?'Objective only · F pending':'Written review complete'}</small></td><td><span class="pill ${r.score.critical.length?'warn':''}">${r.score.critical.length?'Review Q'+r.score.critical.join(', '):'No critical flags'}</span></td><td>${esc(r.stage)}</td><td>${cmp(r)===null?'Pending':cmp(r).toFixed(1)+' / 100'}</td><td><button onclick="openCandidate('${r.id}')" aria-label="Review ${esc(r.name)}">Review</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No candidates match these filters.</div>'}
function openCandidate(id){selected=rows.find(r=>r.id===id);lastFocus=document.activeElement;const r=selected;$('drawer').classList.remove('hidden');$('drawer').innerHTML=`<section class="panel"><button class="close" onclick="closeDrawer()" id="close-detail">Close</button><div class="eyebrow">Candidate review · fictional fixture</div><h1 id="detailtitle">${esc(r.name)}</h1><p class="muted">${r.id} · ${esc(r.cohort)} · ${esc(r.identity)}<br>Version SA01-1.0-source · Original attempt 1</p><div class="card"><div class="row"><h2>Written assessment</h2><strong>${r.score.total===null?r.score.objective+'/90 · F pending':r.score.total+'/100'}</strong></div><span class="pill ${gate(r.score)==='Recommended gates met'?'':'warn'}">${gate(r.score)}</span>${Object.entries(r.score.sections).map(([k,v])=>`<div class="domain"><div class="row"><span>${names[k]}</span><strong>${v.earned===null?'Pending':v.earned+'/'+v.possible+' · '+v.percentage+'%'}</strong></div><div class="bar"><span style="width:${v.percentage??0}%"></span></div><small class="muted">${k==='F'?'Human rubric · no correct/incorrect count':v.correct+'/'+v.total+' correct · '+v.attempted+' attempted'}</small></div>`).join('')}<p class="small">Critical review: ${r.score.critical.length?'Missed Q'+r.score.critical.join(', '):'Q21–23 correct'} · Section D ${r.score.sections.D.earned}/25</p></div><div class="card"><h2>Section F · human review</h2><p class="muted small">Supplied SA-02 rubric · 10 points. Grade the written response before considering non-job-related information.</p><blockquote style="margin:15px 0;line-height:1.6">${esc(r.answers[31])}</blockquote><div class="rubric">${RUBRIC.map(([n,max,anchor],i)=>`<label><span><strong>${esc(n)}</strong><br><small class="muted">${esc(anchor)}</small></span><select id="rating-${i}" aria-label="${esc(n)} points"><option value="">Pending</option>${Array.from({length:max+1},(_,v)=>`<option value="${v}" ${r.ratings?.[i]===v?'selected':''}>${v}/${max}</option>`).join('')}</select></label>`).join('')}</div><p class="small muted">Use full-credit standards consistently; approve any intermediate-credit rules prospectively.</p><label>Reviewer name<input id="reviewer" value="${esc(r.reviewer)}" style="display:block;width:100%"></label><label>Evidence and rationale<textarea id="notes" placeholder="Job-related evidence for the rating">${esc(r.notes)}</textarea></label><button class="primary" onclick="saveReview()">Save demo review</button></div><div class="card"><h2>Selection decision</h2><p>Written: ${r.score.total??'Pending'} · Interview: ${r.interview??'Pending'} · Work sample: ${r.work??'Pending'}</p><p><strong>Composite: ${cmp(r)===null?'Pending all required results':cmp(r).toFixed(1)+'/100'}</strong></p><p class="muted small">Example interview/work scores are synthetic fixtures, not assessments generated here. A composite alone does not establish eligibility.</p><label>Human disposition<select id="decision" style="display:block;width:100%">${['Pending','Continue review','Interview','Standardized retest review','Waitlist','Selected','Not selected'].map(x=>`<option ${r.decision===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Decision rationale<textarea id="reason" placeholder="Document job-related facts and any standardized retest process">${esc(r.reason||'')}</textarea></label><button onclick="saveDecision()">Record demo decision</button> <button onclick="window.print()">Print review</button><p id="detail-message" role="status"></p></div></section>`;$('close-detail').focus()}
function closeDrawer(){$('drawer').classList.add('hidden');selected=null;if(mode==='dashboard')dashboard();if(lastFocus?.isConnected)lastFocus.focus();else $('search')?.focus()}
function saveReview(){const ratings=RUBRIC.map((_,i)=>$('rating-'+i).value),reviewer=$('reviewer').value.trim(),notes=$('notes').value.trim();if(ratings.some(x=>x==='')||!reviewer||!notes){$('detail-message').textContent='Complete all six ratings, reviewer name, and evidence before saving.';return}const r=selected;r.ratings=ratings.map(Number);r.reviewer=reviewer;r.notes=notes;r.score.sections.F.earned=r.ratings.reduce((a,b)=>a+b,0);r.score.sections.F.percentage=r.score.sections.F.earned*10;r.score.total=r.score.objective+r.score.sections.F.earned;r.score.status='Scored';r.score.recommendedGates={total:r.score.total>=75,safety:r.score.sections.D.earned>=20,critical:r.score.critical.length===0};r.stage='Human review';log('Written rubric saved',r.id);openCandidate(r.id);$('detail-message').textContent='Demo review saved in this browser session.'}
function saveDecision(){let reason=$('reason').value.trim();if(!reason){$('detail-message').textContent='A job-related rationale is required.';return}selected.decision=$('decision').value;selected.reason=reason;log('Human decision recorded',selected.id);$('detail-message').textContent='Demo disposition recorded. No invitation or candidate message was sent.'}
function download(name,text,type='text/plain'){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function downloadCSV(){let data=[['Candidate ID','Demo name','Version','A','B','C','D','E','F','Objective /90','Written /100','Critical review','Interview','Work sample','Composite','Decision','Rationale'],...rows.map(r=>[r.id,r.name,r.score.version,...Object.values(r.score.sections).map(v=>v.earned??'Pending'),r.score.objective,r.score.total??'Pending',r.score.critical.join(';'),r.interview??'Pending',r.work??'Pending',cmp(r)??'Pending',r.decision,r.reason||''])];download('Delta_MA_Apprentice_DEMO.csv',data.map(r=>r.map(x=>{let s=String(x);if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(',')).join('\r\n'),'text/csv');log('Demo CSV exported','Cohort')}
const roster=[['Maria Lopez','04/12/1948','104382','9:00 AM','Follow-up','817-555-0124'],['Harold Green','11/03/1939','104515','9:20 AM','Annual wellness','817-555-0177'],['Evelyn Carter','08/19/1951','104627','9:40 AM','Same-day','817-555-0196'],['James Wilson','02/28/1946','104711','10:00 AM','Follow-up','682-555-0119'],['Alice Nguyen','06/08/1956','104804','10:20 AM','Lab visit','817-555-0161'],['Samuel Brown','12/15/1942','104955','10:40 AM','Follow-up','469-555-0142']];
const instructions={A:'Compare the work-queue entry with the roster. Select Accurate, or Discrepancy and the incorrect field. Each item is 2 points.',B:'For this section only: follow-up = 20 minutes; new patient and annual wellness = 40 minutes; no overbooking. Kilograms = pounds / 2.2.',C:'Choose the best response. Each item is 3 points.',D:'Delta rules: apprentices do not diagnose, prescribe, change doses, or independently triage. Escalate potential emergencies immediately under protocol. Use two patient identifiers. Disclose PHI only to authorized persons for permitted purposes. Report exposure/sharps incidents immediately.',E:'Mock routing guide: appointments → Scheduling; refills → Clinical/Refill; results → Clinical/Provider; statements/payments → Billing; referral authorization/status → Referrals; forms/FMLA/disability paperwork → Forms/Admin. Potential emergencies → immediate verbal escalation under emergency protocol, not a routine queue.',F:'Write a concise message for the clinical team. Do not give medical advice.'};
function assessment(){const q=QUESTIONS[question-1];$('app').innerHTML=`<div class="form-shell"><div class="eyebrow">Medical Assistant Apprentice · SA-01</div><h1>Candidate assessment preview</h1>${banner()}${!started?`<section class="card"><h2>Before you begin</h2><p>This assessment measures accuracy, aptitude, judgment, communication, and following written rules. Prior medical-assistant experience is not required.</p><p>70 minutes · 100 points · basic four-function calculator permitted. No phone, internet, notes, or outside assistance. All patient information is fictional.</p><p>Request an accommodation from the administrator before starting; do not provide medical details here.</p><p class="muted">This is a practice preview. It does not verify identity, enforce a hiring attempt, or issue a scored applicant result. Only the candidate form is shown.</p><button class="primary" onclick="startPreview()">Start practice preview</button> <button onclick="printForm()">Print candidate form</button></section>`:submitted?`<section class="card receipt"><div class="eyebrow">Practice response recorded</div><h2>Preview complete</h2><p>Your practice responses remain in this browser session. No applicant record or hiring score was created.</p><button onclick="downloadDraft()">Download practice responses</button><p class="muted small">Live administration requires verified invitations, secure server storage, and administrator configuration.</p></section>`:`<div class="sticky"><div class="row"><span>Question ${question} of 31 · Section ${q.section}</span><span class="timer" id="timer">${clock()}</span></div><div class="bar"><span style="width:${Object.keys(draft).filter(k=>draft[k]).length/31*100}%"></span></div><div class="stepnav">${QUESTIONS.map(x=>`<button class="${x.id===question?'current':''} ${draft[x.id]?'answered':''}" onclick="go(${x.id})" aria-label="Question ${x.id}" ${x.id===question?'aria-current="step"':''}>${x.id}</button>`).join('')}</div></div><section class="card question-card"><h2>${q.section} · ${names[q.section]}</h2><p class="muted">${instructions[q.section]}</p>${q.section==='A'?`<div class="reference"><table><thead><tr>${['Patient','DOB','MRN','Time','Visit','Phone'].map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${roster.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`:''}<fieldset><legend tabindex="-1" id="prompt">${q.id}. ${esc(q.prompt)}</legend>${q.id<=10?`<label class="option"><input name="answer" type="radio" value="Accurate" ${draft[q.id]==='Accurate'?'checked':''} onchange="setAnswer('Accurate')">Accurate</label><label class="option"><input name="answer" type="radio" value="Discrepancy" ${draft[q.id]&&draft[q.id]!=='Accurate'?'checked':''} onchange="setAnswer('Discrepancy')">Discrepancy</label><label>Incorrect field<select aria-label="Incorrect field" onchange="setAnswer(this.value)" ${draft[q.id]==='Accurate'?'disabled':''}><option value="Discrepancy">Select a field</option>${['Name','DOB','MRN','Time','Visit','Phone'].map(x=>`<option value="${x}" ${draft[q.id]===x?'selected':''}>${x}</option>`).join('')}</select></label>`:q.id===31?`<textarea id="written" maxlength="5000" aria-label="Message to clinical team" oninput="saveWritten(this.value)">${esc(draft[31]||'')}</textarea><p class="small muted">Saved in this browser session. Do not enter real patient or applicant information.</p>`:q.options.map(x=>`<label class="option"><input type="radio" name="answer" value="${x.id}" ${draft[q.id]===x.id?'checked':''} onchange="setAnswer('${x.id}')"><span>${x.id}. ${esc(x.text)}</span></label>`).join('')}</fieldset></section><div class="row"><button onclick="go(${question-1})" ${question===1?'disabled':''}>Previous</button>${question<31?`<button class="primary" onclick="go(${question+1})">Next question</button>`:`<button class="primary" onclick="submitPreview()">Review and submit practice</button>`}</div><p class="muted small">${Object.keys(draft).filter(k=>draft[k]).length}/31 answered · Session save only · timer is a preview</p>`}</div>`}
function clock(){return Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0')}function startPreview(){started=true;remaining=4200;assessment()}function go(n){if(n<1||n>31)return;question=n;assessment();$('prompt')?.focus()}function setAnswer(v){draft[question]=v;sessionStorage.setItem('delta-candidate-preview',JSON.stringify(draft));assessment()}function saveWritten(v){draft[31]=v;sessionStorage.setItem('delta-candidate-preview',JSON.stringify(draft))}function submitPreview(){let missing=QUESTIONS.filter(q=>!draft[q.id]).length;if(confirm(`${missing} unanswered items. Confirm that you completed this practice without outside assistance and submit?`)){submitted=true;assessment()}}function downloadDraft(){download('SA01_Practice_Responses.json',JSON.stringify({mode:'practice-only',candidate_id:'DEMO-PRACTICE',version:'SA01-1.0-source',answers:draft},null,2),'application/json')}
setInterval(()=>{if(started&&!submitted&&remaining>0){remaining--;$('timer')&&($('timer').textContent=clock());if(remaining===0){submitted=true;if(mode==='assessment')assessment()}}},1000);
function printForm(){let win=window.open('','_blank');if(!win)return;win.document.write('<!doctype html><html><head><title>SA-01 Candidate Form</title><style>body{font:14px system-ui;line-height:1.5;max-width:900px;margin:40px}section{break-before:page}article{break-inside:avoid;margin:20px 0}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:5px}textarea{width:100%;height:200px}</style></head><body><h1>Delta Medical PA</h1><h2>Medical Assistant Apprentice Selection Assessment · SA-01</h2><p>Candidate name or ID: ____________________ Date: __________ Administrator: __________</p><p>70 minutes · 100 points · four-function calculator allowed. No phone, internet, notes, or outside assistance. All patient data is fictional. Request accommodations before starting; medical details are not required on this form. Prior MA experience is not required. Do not give independent medical advice.</p>'+Object.entries(names).map(([k,name])=>'<section><h2>Section '+k+' · '+name+'</h2><p>'+instructions[k]+'</p>'+(k==='A'?'<table><tr>'+['Patient','DOB','MRN','Time','Visit','Phone'].map(x=>'<th>'+x+'</th>').join('')+'</tr>'+roster.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table>':'')+QUESTIONS.filter(q=>q.section===k).map(q=>'<article><strong>'+q.id+'. '+esc(q.prompt)+'</strong>'+(q.id<=10?'<p>☐ Accurate &nbsp; ☐ Discrepancy — incorrect field: __________________</p>':q.id===31?'<p>_________________________________________________________________<br><br>_________________________________________________________________<br><br>_________________________________________________________________<br><br>_________________________________________________________________</p>':q.options.map(x=>'<div>☐ '+x.id+'. '+esc(x.text)+'</div>').join(''))+'</article>').join('')+'</section>').join('')+'<p>Certification: I completed this assessment without outside assistance and understand all patient information is fictional.</p><p>Candidate signature: ______________________ Date: __________</p></body></html>');win.document.close();win.focus();setTimeout(()=>win.print(),300)}
function guide(){$('app').innerHTML=`<div class="eyebrow">Employer administration · SA-03 / SA-04</div><h1>Consistent selection, documented review</h1>${banner()}<div class="two"><section class="card"><h2>Administration</h2><ol><li>Confirm published minimum qualifications.</li><li>Provide the same SA-01 version and instructions for the cohort.</li><li>Provide a quiet setting, 70 uninterrupted minutes, scratch paper, and a basic calculator.</li><li>Record approved administration adjustments without diagnosis details.</li><li>Collect materials; score objective items from SA-02 on the server.</li><li>Review Section F using the six supplied rubric criteria.</li><li>Document safety flags and a consistent disposition or authorized retest.</li></ol><p>Use fictional data only. Do not ask applicants to perform productive unpaid work or access patient records.</p><button onclick="printForm()">Print candidate assessment</button></section><section class="card"><h2>Selection sequence</h2><p>Minimum qualifications → written assessment → F-09 structured interview → F-10 work sample → human final review.</p><p>Internal recommendations: written ≥75; Section D ≥20/25; Q21–23 correct. Interview ≥75 without unsafe scope/privacy response. Work sample ≥75 without a critical failure.</p><p>SA-04 composite uses 40/30/30 weights only when all components exist. Rank only applicants with documented passed gates. Tie-breakers: F-10, Section D, then F-09 reliability.</p><p class="muted">F-09 and F-10 instruments were not supplied. Do not fabricate those scores or substitute a new rubric without approval.</p></section></div><section class="card" style="margin-top:20px"><h2>Before applicant launch</h2><p>The downloadable implementation package provides server scoring, candidate-safe question data, database constraints, and launch checks. Live verification, email/phone delivery, administrator accounts, invitation expiry, retention, and public hosting require configuration and end-to-end testing.</p><p>Current status: source scoring tests passed; live applicant authentication, OTPs, database concurrency, RLS, and cross-device resume are not tested. This private preview does not accept real candidates.</p><p>Scored use is owner-authorized. Independent validation and item-specific reviewer signoff are not documented in the supplied package. Internal thresholds are recommendations, not validated predictions.</p><p>Human hiring decisions, a review/appeal contact, accommodations, and applicable record-retention requirements remain part of administration. Review job-relatedness and selection outcomes after each cohort.</p><p class="muted">Suggested privacy notice: Delta collects application identity, assessment responses, reviewer ratings, and selection rationale for recruitment. Do not submit medical history or real patient information. Set the retention period and contact before applicant launch.</p></section>`}
document.addEventListener('keydown',e=>{if($('drawer').classList.contains('hidden'))return;if(e.key==='Escape'){closeDrawer();return}if(e.key==='Tab'){const els=[...$('drawer').querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});$('drawer').addEventListener('click',e=>{if(e.target===$('drawer'))closeDrawer()});render();
</script></body></html>
